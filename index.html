<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماما هيام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&family=Tajawal:wght@500&display=swap">
<style>
:root{--bg:#1d0a1b;--rose:#4a1238;--pink:#ff4d94;--blush:#ffc2dc;--teal:#3fc7bb;--mint:#bff3ec;--champ:#ffe3b8;--ink:#fff3f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0a1b;--ink:#fff3f8}}
:root[data-theme="dark"]{--bg:#1d0a1b;--ink:#fff3f8}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:linear-gradient(160deg,var(--rose),var(--bg) 60%);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--rose);z-index:20}
.aurora b{position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.45;z-index:0;pointer-events:none}
.aurora b:nth-child(1){background:#ff4d94;top:-25vmax;right:-20vmax;animation:dr1 16s ease-in-out infinite alternate}
.aurora b:nth-child(2){background:#3fc7bb;opacity:.22;bottom:-30vmax;left:-25vmax;animation:dr2 20s ease-in-out infinite alternate}
.aurora b:nth-child(3){background:#b5287a;top:30vh;left:10vw;opacity:.3;animation:dr1 24s ease-in-out infinite alternate-reverse}
@keyframes dr1{to{transform:translate(-12vmax,14vmax) scale(1.2)}}
@keyframes dr2{to{transform:translate(14vmax,-12vmax) scale(1.15)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:6;pointer-events:none}
#gate,#stage{position:relative;z-index:2}
#gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;text-align:center}
.me{position:relative;width:208px;height:208px;animation:bob 3.4s ease-in-out infinite}.me img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:4px solid #fff;box-shadow:0 0 0 8px rgba(255,255,255,.16),0 0 46px rgba(255,255,255,.5)}
@keyframes bob{50%{transform:translateY(-14px) rotate(-6deg)}}
.hint{font-family:"Aref Ruqaa",Georgia,serif;font-size:clamp(30px,9vw,44px);line-height:1.5;background:linear-gradient(100deg,var(--blush),#fff,var(--champ),var(--blush));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 5s linear infinite}
@keyframes shim{to{background-position:-300% 0}}
.wrap{position:relative;border-radius:999px}
.wrap::before,.wrap::after{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid #fff;pointer-events:none;animation:ring 2.4s ease-out infinite}
.wrap::after{animation-delay:1.2s}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.55,1.9);opacity:0}}
#go{position:relative;overflow:hidden;font:700 23px/1 "Tajawal",sans-serif;color:#fff;background:linear-gradient(135deg,#ff6aa8,#ff2f7d);border:0;border-radius:999px;padding:20px 48px;cursor:pointer;box-shadow:0 0 0 7px rgba(255,77,148,.18),0 16px 44px rgba(255,47,125,.55);animation:beat 1.8s ease-in-out infinite}
#go::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
@keyframes shine{to{left:130%}}
@keyframes beat{40%{transform:scale(1.06)}60%{transform:scale(.98)}}
#go:focus-visible,#lv:focus-visible{outline:3px solid var(--teal);outline-offset:6px}
#wipe{position:fixed;inset:0;z-index:8;pointer-events:none;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#ffd0e4,#ff4d94 55%,#b5287a);clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path .8s cubic-bezier(.6,0,.4,1),opacity .8s ease}
#wipe.on{clip-path:circle(160vmax at var(--x,50%) var(--y,50%))}
#wipe.off{opacity:0}
#stage{display:none;min-height:100vh;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px 20px 56px;text-align:center;perspective:900px}
.open #stage{display:flex}
.float{position:relative;animation:flt 6s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-12px)}}
.tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out;transform-style:preserve-3d}
.frame{position:relative;width:min(76vw,330px);aspect-ratio:4/5;padding:7px;border-radius:999px 999px 30px 30px;overflow:hidden;clip-path:circle(0% at 50% 100%);animation:bloom 1.7s cubic-bezier(.2,.8,.2,1) .2s forwards;filter:drop-shadow(0 0 22px rgba(255,255,255,.5))}
.frame::before{content:"";position:absolute;inset:-60%;background:conic-gradient(#fff,var(--pink),#fff,var(--blush),#fff,var(--pink),#fff);animation:spin 5s linear infinite}
.frame img{position:relative;width:100%;height:100%;object-fit:cover;object-position:72% 30%;display:block;border-radius:993px 993px 24px 24px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bloom{to{clip-path:circle(150% at 50% 100%)}}
.sp{position:absolute;font-size:20px;color:#fff;opacity:0;animation:tw 2.6s ease-in-out infinite;text-shadow:0 0 12px var(--pink)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(90deg)}}
h1{font-family:"Aref Ruqaa",Georgia,serif;font-size:clamp(50px,15vw,74px);line-height:1.3;background:linear-gradient(100deg,var(--blush),#fff,var(--champ),var(--pink),var(--blush));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;animation:titlein 1.3s cubic-bezier(.2,.8,.2,1) 1.5s forwards,shim 6s linear 1.5s infinite;filter:drop-shadow(0 4px 18px rgba(255,77,148,.5))}
@keyframes titlein{from{opacity:0;transform:scale(.6) translateY(20px);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
.card{width:min(92vw,520px);padding:24px 22px;border-radius:30px;background:rgba(255,255,255,.07);border:1px solid rgba(255,194,220,.3);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.3),inset 0 0 40px rgba(255,77,148,.08);opacity:0;animation:rise 1s ease 2.4s forwards}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
#msg{display:flex;flex-direction:column;gap:12px;font-family:"Amiri","Traditional Arabic",serif;font-size:clamp(20px,5.2vw,24px);line-height:2.1;min-height:12em}
#msg .dua{color:var(--blush)}
.cr{display:inline-block;color:#fff;text-shadow:0 0 10px #fff;font-size:.8em;margin-inline-start:.2em;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#love{display:none;flex-direction:column;align-items:center;gap:10px}
#love.show{display:flex;animation:pop .8s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
#lv{font-size:64px;line-height:1;background:none;border:0;cursor:pointer;filter:drop-shadow(0 0 18px #fff);animation:beat 1.4s ease-in-out infinite;transition:transform .1s}
#lv:active{transform:scale(.8)}
#lab{font-family:"Amiri",serif;font-size:25px;color:var(--champ);min-height:2em;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){.me,.wr,.hint,.wrap::before,.wrap::after,#go,#go::after,.float,.frame::before,.sp,h1,.card,.cr,#lv,.aurora b{animation:none!important}.frame{clip-path:none}h1,.card{opacity:1}h1{filter:none}#fx{display:none}}
.float{--W:min(76vw,330px);margin:calc(var(--W)*.14) 0}
.fw{position:absolute;left:calc(var(--W)*-.14);top:calc(var(--W)*-.14);width:calc(var(--W)*1.28);height:calc(var(--W)*1.53);pointer-events:none;overflow:visible;filter:drop-shadow(0 0 5px rgba(255,255,255,.4))}
.fw .f{transform-box:fill-box;transform-origin:center;opacity:0;animation:fpop .8s cubic-bezier(.3,1.5,.5,1) calc(1.8s + var(--i)*42ms) forwards}
@keyframes fpop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
.pp{animation:lpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes lpop{from{opacity:0;transform:scale(.4) translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fw .f{animation:none!important;opacity:1}}
</style>
</head>

function mk(init){return{x:R()*W,y:init?R()*H:H+40,s:8+R()*24,v:.4+R()*1.1,sw:10+R()*30,ph:R()*6.28,r:(R()-.5)*.6,a:.25+R()*.6,c:COL[R()*COL.length|0]}}
for(var i=0;i<34;i++)amb.push(mk(true));
function burst(x,y,n,big){if(calm)return;for(var i=0;i<n;i++){var a=R()*6.28,v=(big?3:2)+R()*(big?7:4);
pt.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.09,s:(big?10:7)+R()*(big?16:10),r:(R()-.5)*.8,vr:(R()-.5)*.1,l:0,m:70+R()*50,c:COL[R()*COL.length|0]})}
if(pt.length>220)pt.splice(0,pt.length-220)}
function trail(x,y){if(calm)return;pt.push({x:x,y:y,vx:(R()-.5)*.8,vy:-.8-R(),g:-.01,s:6+R()*8,r:(R()-.5)*.6,vr:0,l:0,m:55,c:COL[R()*COL.length|0]})}
var em=[],meEl=document.querySelector(".me");
function emit(){if(open){em.length=0;return}
var r=meEl.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2,R0=r.width/2;
if(R()<.5&&em.length<150){var a=R()*6.283,sp=.45+R()*.9;em.push({x:mx+Math.cos(a)*R0,y:my+Math.sin(a)*R0,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:0,m:90+R()*70,s:4+R()*7,r:(R()-.5)*.8,ph:R()*6.28})}
for(var i=em.length-1;i>=0;i--){var e=em[i];e.l++;if(e.l>e.m){em.splice(i,1);continue}
e.x+=e.vx+Math.sin(e.l*.06+e.ph)*.25;e.y+=e.vy;var f=e.l/e.m,al=Math.min(1,e.l/10)*Math.pow(1-f,1.4)*.95;
cx.save();cx.translate(e.x,e.y);cx.rotate(e.r);cx.globalAlpha=al;cx.fillStyle=cx.shadowColor="#fff";heart(e.s);cx.restore()}}
function loop(){cx.clearRect(0,0,W,H);
if(!calm){cx.shadowBlur=14;var t=Date.now()/1000,k=open?1:.6;
for(var i=0;i<amb.length;i++){var h=amb[i];if(i>amb.length*k)continue;h.y-=h.v;if(h.y<-40)amb[i]=h=mk(false);
cx.save();cx.translate(h.x+Math.sin(t+h.ph)*h.sw,h.y);cx.rotate(h.r+Math.sin(t+h.ph)*.2);cx.globalAlpha=h.a;cx.fillStyle=cx.shadowColor=h.c;heart(h.s);cx.restore()}
emit();for(var j=pt.length-1;j>=0;j--){var p=pt[j];p.l++;if(p.l>p.m){pt.splice(j,1);continue}
p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;
cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=1-p.l/p.m;cx.fillStyle=cx.shadowColor=p.c;heart(p.s);cx.restore()}}
requestAnimationFrame(loop)}
loop();
var go=document.getElementById("go"),tl=document.getElementById("tilt"),lv=document.getElementById("lv"),lab=document.getElementById("lab"),
sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var seg=window.Intl&&Intl.Segmenter?new Intl.Segmenter("ar",{granularity:"grapheme"}):null;
function chars(s){return seg?Array.from(seg.segment(s),function(x){return x.segment}):Array.from(s)}
var lines=[];function prep(){var m=document.getElementById("msg");m.style.minHeight=m.offsetHeight+"px";document.querySelectorAll("#msg p").forEach(function(p){lines.push(p.textContent.trim());p.textContent=""})}
async function typeAll(){
var ps=[].slice.call(document.querySelectorAll("#msg p")),cr=document.createElement("span");cr.className="cr";cr.textContent="♥";
for(var i=0;i<ps.length;i++){var p=ps[i],full=lines[i],cs=chars(full),s="",n=0;p.textContent="";
var t=document.createElement("span");p.appendChild(t);p.appendChild(cr);
for(var j=0;j<cs.length;j++){s+=cs[j];t.textContent=s;n++;
if(n%9===0){var b=cr.getBoundingClientRect();trail(b.left+4,b.top)}
await sleep(/[،]/.test(cs[j])?320:cs[j]===" "?55:38)}
await sleep(450)}
cr.remove();
var L=document.getElementById("love");L.classList.add("show");var q=L.getBoundingClientRect();burst(innerWidth/2,q.top+30,60,true)}
go.addEventListener("click",function(e){
var r=go.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,w=document.getElementById("wipe");
if(calm){document.getElementById("gate").style.display="none";document.body.classList.add("open");
document.querySelectorAll("#msg p").forEach(function(p){p.style.opacity=1});document.getElementById("love").classList.add("show");return}
burst(x,y,90,true);w.style.setProperty("--x",x+"px");w.style.setProperty("--y",y+"px");
requestAnimationFrame(function(){w.classList.add("on")});
setTimeout(function(){document.getElementById("gate").style.display="none";document.body.classList.add("open");open=true;prep();scrollTo(0,0);w.classList.add("off");
setTimeout(function(){burst(innerWidth/2,innerHeight*.4,50,true)},900);
setTimeout(typeAll,2600)},850)});
addEventListener("pointermove",function(e){
if(open){var nx=e.clientX/innerWidth-.5,ny=e.clientY/innerHeight-.5;tl.style.setProperty("--rx",(-ny*16)+"deg");tl.style.setProperty("--ry",(nx*20)+"deg")}
if(e.pointerType!=="mouse"||open){var d=Math.hypot(e.clientX-(window.lx||0),e.clientY-(window.ly||0));if(d>30){window.lx=e.clientX;window.ly=e.clientY;trail(e.clientX,e.clientY)}}});
addEventListener("pointerup",function(){tl.style.setProperty("--rx","0deg");tl.style.setProperty("--ry","0deg")});
addEventListener("pointerdown",function(e){if(open&&e.target!==lv)burst(e.clientX,e.clientY,16,false)});
var PH="ربنا يباركلي فيك ي قمر 🫶🏻";
lv.addEventListener("click",function(){var r=lv.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,36,true);
lab.textContent=PH;lab.classList.remove("pp");void lab.offsetWidth;lab.classList.add("pp")});
})();
</script>
